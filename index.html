<!doctype html>

  <meta name="theme-color" content="#7a1f2b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <a class="skip-link" href="#main">تخطّي إلى المحتوى</a>

  <header class="topbar" id="topbar">

      <a class="brand" href="#/" aria-label="فُسحة إبداع — لوحة القيادة">
        <span class="brand-mark" aria-hidden="true" data-icon="spark"></span>

  <dialog id="player" class="player" closedby="any" aria-labelledby="playerTitle">

      <p id="playerTitle"></p>
