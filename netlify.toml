# Site statique : aucune compilation, Netlify publie le dossier tel quel.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"
